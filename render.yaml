services:
  - type: web
    name: quantum-game-portal
    plan: free
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd ../backend && npm install && rm -rf public && cp -r ../frontend/dist public
    startCommand: cd backend && npm run seed:admin && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads
